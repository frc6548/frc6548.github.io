<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Donations - Perry RAMBOTS | High School FRC Team 6548</title>
    <link rel="canonical" href="https://phsrambots.org" />
<link rel="alternate" hreflang="en-US" href="https://phsrambots.org/" /><link rel="alternate" hreflang="x-default" href="https://phsrambots.org/" />
<meta property="og:title" content="Donations - Perry RAMBOTS | High School FRC Team 6548">
    <meta name="description" content="Support Perry RAMBOTS by making a donation. Your contribution helps us build better robots and provide amazing STEM experiences for our students.">
    <meta content="https://phsrambots.org/data/icon-white.webp" property="og:image"/>
    <meta content="#ff4040" data-react-helmet="true" name="theme-color"/>
    
    <link rel="icon" type="image/png" href="/data/icon.webp" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/data/icon-white.webp" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/data/icon-global.webp">
    
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <script src="/js/header.js"></script>
    <div class="container">
         <h1 class="superh1">Donations</h1>
        <h2 class="center-normal">Can't use the links below? Email admin@phsrambots.org</h2>
        <div class="divider"></div>
    </div>

    <div class="sponsorsection">
        <h2 class="sponsorheader no-margin">PayPal</h2>
        <div class="sponsor-subtitle"><a href="https://www.paypal.com/ncp/pament/CSJ9MRPXZYJ3Y/" rel="noopener noreferrer">PayPal Donation Link</a></div>
        <div class="donatesidebyside">
            <img class="qr" src="/data/donate/paypal-qr.webp" alt="PayPal QR code">
            <div id="donate-button-container">
                <div id="donate-button"></div>
                <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
                <script>
                    PayPal.Donation.Button({
                    env:'production',
                    hosted_button_id:'K9C94VBN4D8HG',
                    image: {
                    src:'/data/donate/paypal-db.webp',
                    alt:'Donate with PayPal button',
                    title:'PayPal - The safer, easier way to pay online!',
                    }
                    }).render('#donate-button');
                </script>
            </div>
        </div>
    </div>
</body>
