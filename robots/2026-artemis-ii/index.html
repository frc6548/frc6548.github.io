<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemis II - Perry RAMBOTS</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
canvas { display: block; opacity: 0; transition: opacity 1.4s ease; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const canvas = document.getElementById('c');
const W = () => window.innerWidth, H = () => window.innerHeight;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 2000);
camera.position.set(0, 0.5, 4.2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting
scene.add(new THREE.AmbientLight(0x4466aa, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 4.8);
key.position.set(3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.camera.left = key.shadow.camera.bottom = -2.5;
key.shadow.camera.right = key.shadow.camera.top = 2.5;
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 2.0);
rim.position.set(-4, 2, -3);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xfff0dd, 0.9);
fill.position.set(0, -3, 5);
scene.add(fill);
const accent = new THREE.DirectionalLight(0xff3322, 0.7);
accent.position.set(2, -1, 4);
scene.add(accent);

// Dim sun glow sprite — upper-right corner
const sunCvs = document.createElement('canvas');
sunCvs.width = sunCvs.height = 256;
const sctx = sunCvs.getContext('2d');
const grad = sctx.createRadialGradient(128, 128, 0, 128, 128, 128);
grad.addColorStop(0,    'rgba(255, 248, 210, 1)');
grad.addColorStop(0.12, 'rgba(255, 220, 130, 0.85)');
grad.addColorStop(0.4,  'rgba(255, 180, 60, 0.25)');
grad.addColorStop(1,    'rgba(255, 150, 20, 0)');
sctx.fillStyle = grad;
sctx.fillRect(0, 0, 256, 256);
const sun = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(sunCvs),
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.5
}));
sun.position.set(2.8, 2.8, -3);
sun.scale.set(3.2, 3.2, 1);
scene.add(sun);

// Shadow catcher
const shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 6),
    new THREE.ShadowMaterial({ opacity: 0.38 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

// Load robot
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let robot = null;
let baseScale = 1;

loader.load('/data/artemis2.glb', (gltf) => {
    robot = gltf.scene;
    const box = new THREE.Box3().setFromObject(robot);
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = box.getSize(new THREE.Vector3()).length();
    const scale = 2.6 / maxDim;
    baseScale = scale;
    robot.scale.setScalar(scale);
    robot.position.copy(center.multiplyScalar(-scale));
    robot.position.x -= 1.2;
    robot.traverse(child => {
        if (!child.isMesh) return;
        child.castShadow = true;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(mat => {
            if (mat && mat.isMeshStandardMaterial) {
                mat.metalness = Math.max(mat.metalness, 0.72);
                mat.roughness = Math.min(mat.roughness, 0.22);
                mat.needsUpdate = true;
            }
        });
    });
    scene.add(robot);
    const worldBox = new THREE.Box3().setFromObject(robot);
    shadowPlane.position.set(robot.position.x, worldBox.min.y - 0.05, 0);
    canvas.style.opacity = '1';
});

// Scale driven by proximity postMessage from the parent page
// (pointer-events:none on the iframe means mousemove never fires here)
let targetScale = 1.0;
let currentScale = 1.0;
window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'proximity') {
        targetScale = 1.0 + 0.1 * e.data.value;
    }
});

let t = 0;
function animate() {
    requestAnimationFrame(animate);
    t += 0.008;
    currentScale += (targetScale - currentScale) * 0.07;
    if (robot) {
        robot.rotation.y = t * 0.28;
        robot.position.y = Math.sin(t * 0.42) * 0.06;
        robot.scale.setScalar(baseScale * currentScale);
    }
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = W() / H();
    camera.updateProjectionMatrix();
    renderer.setSize(W(), H());
});
</script>
</body>
</html>
