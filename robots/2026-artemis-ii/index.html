<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemis II - Perry RAMBOTS</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const canvas = document.getElementById('c');
const W = () => window.innerWidth, H = () => window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.0014);

const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 2000);
camera.position.set(0, 0.5, 4.2);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

// Stars — two layers for depth
const mkStars = (count, size, color, rMin, rMax) => {
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        const r = rMin + Math.random() * (rMax - rMin);
        pos[i*3]   = r * Math.sin(p) * Math.cos(t);
        pos[i*3+1] = r * Math.sin(p) * Math.sin(t);
        pos[i*3+2] = r * Math.cos(p);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({ color, size, sizeAttenuation: true }));
};
scene.add(mkStars(2400, 1.3, 0xffffff,  80, 900));
scene.add(mkStars(180,  2.6, 0xaaccff, 100, 700));

// Lighting — dramatic space with red team accent
scene.add(new THREE.AmbientLight(0x112255, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(2, 3, 2);
scene.add(key);
const rim = new THREE.DirectionalLight(0x4488ff, 1.3);
rim.position.set(-3, 0.5, -2);
scene.add(rim);
const accent = new THREE.DirectionalLight(0xff4040, 0.7);
accent.position.set(1, -1, 3);
scene.add(accent);

// Load Draco-compressed robot
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let robot = null;
loader.load('/data/artemis2.glb', (gltf) => {
    robot = gltf.scene;
    const box = new THREE.Box3().setFromObject(robot);
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = box.getSize(new THREE.Vector3(0,0,0)).length();
    const scale = 2.6 / maxDim;
    robot.scale.setScalar(scale);
    robot.position.copy(center.multiplyScalar(-scale));
    scene.add(robot);
});

// Gentle float animation
let t = 0;
function animate() {
    requestAnimationFrame(animate);
    t += 0.008;
    if (robot) {
        robot.rotation.y = t * 0.28;
        robot.position.y = Math.sin(t * 0.42) * 0.06;
    }
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = W() / H();
    camera.updateProjectionMatrix();
    renderer.setSize(W(), H());
});
</script>
</body>
</html>
