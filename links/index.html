<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Links - Perry RAMBOTS | High School FRC Team 6548</title>
    <link rel="canonical" href="https://phsrambots.org" />
<link rel="alternate" hreflang="en-US" href="https://phsrambots.org/" /><link rel="alternate" hreflang="x-default" href="https://phsrambots.org/" />
<meta property="og:title" content="Links - Perry RAMBOTS | High School FRC Team 6548">
    <meta property="og:description" content="Find links to all of Perry RAMBOTS' social media platforms, including YouTube, TikTok, Instagram, Facebook, and GitHub. Follow us to stay updated on our latest news, matches, and behind-the-scenes content.">
    <meta property="og:image" content="https://phsrambots.org/data/icon-white.webp">
    <meta property="og:url" content="https://phsrambots.org/links">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Perry RAMBOTS">
    <meta content="#ff4040" data-react-helmet="true" name="theme-color"/>
    
    <link rel="icon" type="image/png" href="/data/icon.webp" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/data/icon-white.webp" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/data/icon-global.webp">
    
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <script src="/js/header.js"></script>
    <div class="container">
        <h1 class="superh1">Links</h1>
        <h2 class="center-normal">Follow us on all of our platforms below</h2>
        <div class="divider"></div>

        <div class="qr-main" aria-hidden="false">
            <div class="qr-wrap">
                <a href="https://phsrambots.org" target="_blank" rel="noopener noreferrer" aria-label="Perry RAMBOTS website">
                    <img class="qr-img qr-main-img" src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&ecc=H&data=https%3A%2F%2Fphsrambots.org" alt="Perry RAMBOTS QR">
                </a>
                <div class="qr-logo-bg qr-main-logo-bg" aria-hidden="true">
                    <img class="qr-center-logo" src="/data/icon.webp" alt="">
                </div>
            </div>
            <div class="qr-label qr-main-label">Website</div>
        </div>

        <div class="qr-section">
            <div class="qr-grid" id="qr-grid">
                <!-- First tile (Website) kept static above; remaining tiles populated from data/links.json -->
            </div>
            <script>
                (function(){
                    fetch('/data/links.json', {cache: 'no-store'}).then(function(r){
                        if (!r.ok) throw new Error('no-links');
                        return r.json();
                    }).then(function(ld){
                        var grid = document.getElementById('qr-grid');
                        if (!grid) return;
                        if (ld && Array.isArray(ld.socials)) {
                            ld.socials.forEach(function(s){
                                var item = document.createElement('div'); item.className = 'qr-item';
                                var wrap = document.createElement('div'); wrap.className = 'qr-wrap';
                                var a = document.createElement('a'); a.href = s.url || '#'; a.target = '_blank'; a.rel = 'noopener noreferrer';
                                var qr = document.createElement('img'); qr.className = 'qr-img';
                                var encoded = encodeURIComponent(s.url || '');
                                qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&ecc=H&data=' + encoded;
                                qr.alt = (s.name || 'Link') + ' QR';
                                a.appendChild(qr);
                                var logo = document.createElement('div'); logo.className = 'qr-logo-bg'; logo.setAttribute('aria-hidden','true');
                                if (s.icon) {
                                    var img = document.createElement('img'); img.className = 'qr-center-logo'; img.src = s.icon; img.alt = '';
                                    logo.appendChild(img);
                                }
                                wrap.appendChild(a);
                                wrap.appendChild(logo);
                                var label = document.createElement('div'); label.className = 'qr-label'; label.textContent = s.name || '';
                                item.appendChild(wrap);
                                item.appendChild(label);
                                grid.appendChild(item);
                            });
                        }
                    }).catch(function(){/* ignore */});
                })();
            </script>
        </div>
    </div>
</body>
