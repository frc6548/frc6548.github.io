<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Event Calendar - Perry RAMBOTS | High School FRC Team 6548</title>
    <link rel="canonical" href="https://phsrambots.org" />
<link rel="alternate" hreflang="en-US" href="https://phsrambots.org/" /><link rel="alternate" hreflang="x-default" href="https://phsrambots.org/" />
<meta property="og:title" content="Event Calendar - Perry RAMBOTS | High School FRC Team 6548">
    <meta property="og:description" content="Check out the event calendar for Perry RAMBOTS, FRC Team 6548. Find upcoming competitions, practice sessions, and other important events.">
    <meta property="og:image" content="https://phsrambots.org/data/icon-white.webp">
    <meta property="og:url" content="https://phsrambots.org/calendar">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Perry RAMBOTS">
    <meta content="#ff4040" data-react-helmet="true" name="theme-color"/>
    
    <link rel="icon" type="image/png" href="/data/icon.webp" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/data/icon-white.webp" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/data/icon-global.webp">
    
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <script src="/js/header.js"></script>
        <div class="legacy-container">
            <h1 class="superh1">Event Calendar</h1>
            <h2 class="center-normal">Practice every Tuesday & Thursday 3-7 PM unless noted</h2>
        <div class="divider"></div>
        <div id="calendar-app">
            <div class="calendar-header">
                <button id="prev-month" aria-label="Previous month"><span class="chevron chevron-left"></span></button>
                <div class="calendar-title" id="calendar-title">March 2026</div>
                <button id="next-month" aria-label="Next month"><span class="chevron chevron-right"></span></button>
            </div>

            <div class="calendar-controls">
                <select id="year-select"></select>
                <select id="month-select"></select>
                <button id="load-month">Load</button>
            </div>

            <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="Event calendar"></div>

            <div id="event-modal" class="event-modal" role="dialog" aria-hidden="true">
                <div class="event-modal-content">
                    <button class="modal-close" id="modal-close" aria-label="Close">X</button>
                    <div id="modal-body"></div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="/js/calendar.js"></script>
</body>
