<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calendar Export Template</title>
<!--
  This is the visual template used for "Export to PDF" on the calendar page.
  js/calendar.js fetches this file, fills in the real month title and the
  42 day cells with that month's events, then opens it in a new tab and
  triggers the browser print dialog (Save as PDF).

  Open this file directly in a browser to preview/restyle it - it fills
  itself with sample demo data when there's no real data injected, so you
  can tweak the CSS below and see the result immediately.
-->
<style>
  @font-face {
    font-family: 'Afacad';
    src: url('/data/afacad.ttf') format('truetype');
    font-weight: 100 900;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px;
    font-family: Afacad, sans-serif;
    color: #111;
    background: #fff;
  }

  .cal-export-page {
    max-width: 1050px;
    margin: 0 auto;
  }

  .cal-export-header {
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 4px solid #ff4040;
    padding-bottom: 14px;
    margin-bottom: 18px;
  }

  .cal-export-logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
  }

  .cal-export-team {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #777;
  }

  .cal-export-title {
    margin: 2px 0 0;
    font-size: 30px;
    font-weight: 700;
  }

  .cal-export-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }

  .cal-export-weekdays div {
    text-align: center;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    color: #777;
    padding: 4px 0;
  }

  .cal-export-cells {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 4px;
  }

  .cal-export-cell {
    border: 1px solid #ddd;
    border-radius: 6px;
    min-height: 100px;
    padding: 6px;
    position: relative;
    break-inside: avoid;
  }

  .cal-export-cell.is-empty {
    background: #fafafa;
    border-color: #eee;
  }

  .cal-export-daynum {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .cal-export-events {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .cal-export-event {
    font-size: 10.5px;
    line-height: 1.25;
    background: rgba(255, 64, 64, 0.08);
    border-left: 3px solid #ff4040;
    padding: 2px 4px;
    border-radius: 3px;
    overflow-wrap: anywhere;
  }

  .cal-export-event-time {
    font-weight: 700;
    color: #ff4040;
    margin-right: 3px;
  }

  .cal-export-footer {
    margin-top: 20px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
    font-size: 11px;
    color: #888;
    text-align: center;
  }

  @media print {
    body { padding: 18px; }
    .cal-export-cell { break-inside: avoid; }
  }
</style>
</head>
<body>
  <div class="cal-export-page">
    <header class="cal-export-header">
      <img class="cal-export-logo" src="/data/icon.webp" alt="">
      <div>
        <div class="cal-export-team">Perry RAMBOTS - FRC Team 6548</div>
        <h1 class="cal-export-title" id="cal-export-title"></h1>
      </div>
    </header>

    <div class="cal-export-weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div class="cal-export-cells" id="cal-export-cells"></div>

    <div class="cal-export-footer">phsrambots.org - generated <span id="cal-export-generated"></span></div>
  </div>

  <template id="cal-export-cell-template">
    <div class="cal-export-cell">
      <div class="cal-export-daynum"></div>
      <div class="cal-export-events"></div>
    </div>
  </template>

  <script id="cal-export-demo-script">
    // Standalone preview only: js/calendar.js removes this script before
    // injecting real data, so it never runs during an actual export.
    (function(){
      document.getElementById('cal-export-title').textContent = 'March 2026 (preview)';
      document.getElementById('cal-export-generated').textContent = new Date().toLocaleDateString();

      var cellsWrap = document.getElementById('cal-export-cells');
      var cellTpl = document.getElementById('cal-export-cell-template');
      var startDay = 0; // March 2026 starts on a Sunday
      var daysInMonth = 31;
      var demoEvents = {
        3: [{ time: '3:00 PM', title: 'Practice' }],
        5: [{ time: '3:00 PM', title: 'Practice' }],
        14: [{ time: '9:00 AM', title: 'Regional Kickoff' }],
        20: [{ time: 'All Day', title: 'District Competition' }]
      };

      for (var i = 0; i < 42; i++) {
        var frag = cellTpl.content.cloneNode(true);
        var cellEl = frag.querySelector('.cal-export-cell');
        var dayIndex = i - startDay + 1;
        if (dayIndex > 0 && dayIndex <= daysInMonth) {
          cellEl.querySelector('.cal-export-daynum').textContent = dayIndex;
          var evWrap = cellEl.querySelector('.cal-export-events');
          (demoEvents[dayIndex] || []).forEach(function(ev){
            var d = document.createElement('div');
            d.className = 'cal-export-event';
            var t = document.createElement('span');
            t.className = 'cal-export-event-time';
            t.textContent = ev.time;
            d.appendChild(t);
            d.appendChild(document.createTextNode(ev.title));
            evWrap.appendChild(d);
          });
        } else {
          cellEl.classList.add('is-empty');
        }
        cellsWrap.appendChild(frag);
      }
    })();
  </script>
</body>
</html>
